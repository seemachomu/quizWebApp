<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizWave</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none;
        }
        #admin-panel, #user-panel {
            padding: 20px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="text"], input[type="password"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .question-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        #options-container button {
            display: block;
            width: 100%;
            margin: 5px 0;
            text-align: left;
        }
        .correct {
            background-color: #28a745 !important;
        }
        .incorrect {
            background-color: #dc3545 !important;
        }
        button:disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>Welcome to QuizWave</h1>
            <button id="start-quiz-btn">Start Quiz</button>
            <button id="admin-login-btn">Admin Login</button>
        </div>

        <!-- User Quiz Panel -->
        <div id="user-panel" class="hidden">
            <h2 id="question-text">Question text goes here</h2>
            <div id="options-container">
                <!-- Options will be dynamically inserted here -->
            </div>
            <p>Time left: <span id="timer">30</span>s</p>
            <p>Score: <span id="score">0</span></p>
        </div>

        <div id="quiz-end-screen" class="hidden">
             <h2>Quiz Finished!</h2>
             <p>Your final score is: <span id="final-score">0</span></p>
             <button id="restart-quiz-btn">Play Again</button>
        </div>

        <!-- Admin Panel -->
        <div id="admin-panel" class="hidden">
            <h2>Admin Panel</h2>
            <div id="add-question-form">
                <h3>Add New Question</h3>
                <input type="text" id="new-question" placeholder="Question">
                <input type="text" id="new-option1" placeholder="Option 1">
                <input type="text" id="new-option2" placeholder="Option 2">
                <input type="text" id="new-option3" placeholder="Option 3">
                <input type="text" id="new-option4" placeholder="Option 4">
                <input type="text" id="new-correct-answer" placeholder="Correct Answer (e.g., Option 1)">
                <button id="add-question-btn">Add Question</button>
            </div>
            <hr>
            <h3>Existing Questions</h3>
            <div id="existing-questions-list">
                <!-- Existing questions will be listed here -->
            </div>
             <button id="reset-quiz-btn-admin">Reset Quiz for Users</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const mainMenu = document.getElementById('main-menu');
        const userPanel = document.getElementById('user-panel');
        const adminPanel = document.getElementById('admin-panel');
        const quizEndScreen = document.getElementById('quiz-end-screen');

        const startQuizBtn = document.getElementById('start-quiz-btn');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const restartQuizBtn = document.getElementById('restart-quiz-btn');
        const resetQuizBtnAdmin = document.getElementById('reset-quiz-btn-admin');

        // DOM Elements for Admin Panel
        const addQuestionForm = document.getElementById('add-question-form');
        const newQuestionInput = document.getElementById('new-question');
        const newOption1Input = document.getElementById('new-option1');
        const newOption2Input = document.getElementById('new-option2');
        const newOption3Input = document.getElementById('new-option3');
        const newOption4Input = document.getElementById('new-option4');
        const newCorrectAnswerInput = document.getElementById('new-correct-answer');
        const addQuestionBtn = document.getElementById('add-question-btn');
        const existingQuestionsList = document.getElementById('existing-questions-list');

        // App State
        let isAdmin = false;
        let quizData = [];
        let editingQuestionIndex = null;

        // --- LocalStorage Functions ---
        function getQuizData() {
            const data = localStorage.getItem('quizData');
            if (data) {
                quizData = JSON.parse(data);
            } else {
                // Default questions if nothing is in localStorage
                quizData = [
                    {
                        question: "What does HTML stand for?",
                        options: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyperlink and Text Markup Language", "Home Tool Markup Language"],
                        correct: "Hyper Text Markup Language"
                    },
                    {
                        question: "Which CSS property is used to change the text color of an element?",
                        options: ["font-color", "text-color", "color", "font-style"],
                        correct: "color"
                    }
                ];
                saveQuizData();
            }
        }

        function saveQuizData() {
            localStorage.setItem('quizData', JSON.stringify(quizData));
        }


        // --- Admin Panel Functions ---
        function renderAdminQuestions() {
            existingQuestionsList.innerHTML = '';
            quizData.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';
                questionDiv.innerHTML = `
                    <p><strong>Q:</strong> ${q.question}</p>
                    <p><strong>Correct Answer:</strong> ${q.correct}</p>
                    <button onclick="editQuestion(${index})">Edit</button>
                    <button onclick="deleteQuestion(${index})">Delete</button>
                `;
                existingQuestionsList.appendChild(questionDiv);
            });
        }

        function addQuestion(e) {
            e.preventDefault();
            const newQuestion = {
                question: newQuestionInput.value,
                options: [
                    newOption1Input.value,
                    newOption2Input.value,
                    newOption3Input.value,
                    newOption4Input.value
                ],
                correct: newCorrectAnswerInput.value
            };

            if (editingQuestionIndex !== null) {
                // Update existing question
                quizData[editingQuestionIndex] = newQuestion;
                editingQuestionIndex = null;
                addQuestionBtn.textContent = 'Add Question';
            } else {
                // Add new question
                quizData.push(newQuestion);
            }

            saveQuizData();
            renderAdminQuestions();
            addQuestionForm.reset();
        }

        function editQuestion(index) {
            const q = quizData[index];
            newQuestionInput.value = q.question;
            newOption1Input.value = q.options[0];
            newOption2Input.value = q.options[1];
            newOption3Input.value = q.options[2];
            newOption4Input.value = q.options[3];
            newCorrectAnswerInput.value = q.correct;

            editingQuestionIndex = index;
            addQuestionBtn.textContent = 'Update Question';
            window.scrollTo(0, 0); // Scroll to top to see the form
        }

        function deleteQuestion(index) {
            if (confirm('Are you sure you want to delete this question?')) {
                quizData.splice(index, 1);
                saveQuizData();
                renderAdminQuestions();
            }
        }

        // Event Listeners
        adminLoginBtn.addEventListener('click', () => {
            const password = prompt('Enter admin password:');
            if (password === 'Timesjpr') {
                isAdmin = true;
                mainMenu.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                getQuizData();
                renderAdminQuestions();
            } else {
                alert('Incorrect password!');
            }
        });

        function resetQuizForUsers() {
            if (confirm('Are you sure you want to reset the entire quiz? This will delete all custom questions and restore defaults.')) {
                localStorage.removeItem('quizData');
                getQuizData(); // This will load the defaults
                renderAdminQuestions();
                alert('Quiz has been reset to default questions.');
            }
        }

        resetQuizBtnAdmin.addEventListener('click', resetQuizForUsers);
        addQuestionForm.addEventListener('submit', addQuestion);

        // --- User Panel Functions ---
        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 30;

        function startQuiz() {
            getQuizData();
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score').textContent = score;
            mainMenu.classList.add('hidden');
            quizEndScreen.classList.add('hidden');
            userPanel.classList.remove('hidden');
            displayQuestion();
        }

        function displayQuestion() {
            resetTimer();
            const question = quizData[currentQuestionIndex];
            if (!question) {
                endQuiz();
                return;
            }

            document.getElementById('question-text').textContent = question.question;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(option, button);
                optionsContainer.appendChild(button);
            });

            startTimer();
        }

        function checkAnswer(selectedOption, button) {
            clearInterval(timer); // Stop the timer
            const question = quizData[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;

            if (selectedOption === question.correct) {
                score++;
                document.getElementById('score').textContent = score;
                button.classList.add('correct');
            } else {
                button.classList.add('incorrect');
                // Highlight the correct answer
                for (let btn of buttons) {
                    if (btn.textContent === question.correct) {
                        btn.classList.add('correct');
                    }
                }
            }

            // Disable all option buttons
            for (let btn of buttons) {
                btn.disabled = true;
            }

            setTimeout(nextQuestion, 1500); // Wait 1.5s before next question
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                displayQuestion();
            } else {
                endQuiz();
            }
        }

        function startTimer() {
            timeLeft = 30;
            document.getElementById('timer').textContent = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    nextQuestion(); // Move to next question if time runs out
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 30;
            document.getElementById('timer').textContent = timeLeft;
        }

        function endQuiz() {
            clearInterval(timer);
            userPanel.classList.add('hidden');
            quizEndScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
        }

        startQuizBtn.addEventListener('click', startQuiz);
        restartQuizBtn.addEventListener('click', startQuiz);

    </script>
</body>
</html>
